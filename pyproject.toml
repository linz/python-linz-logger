[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[project]
name = "linz_logger"
version = "0.12.0"
description = "LINZ standard Logging format"
authors = [
    { name = "Blayne Chard", email = "bchard@linz.govt.nz" },
    { name = "Daniel Silk", email = "dsilk@linz.govt.nz" },
    { name = "Alice Fage", email = "afage@linz.govt.nz" },
    { name = "Sheetal Poudel", email = "spoudel@linz.govt.nz" },
    { name = "Stella McGann", email = "smcgann@linz.govt.nz" },
    { name = "Tobias Schmidt", email = "tschmidt@linz.govt.nz" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["LINZ", "logging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = "~=3.12.3"
dependencies = [
    "structlog>=23.2.0,<24.0.0",
    "python-ulid>=1.1.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/linz/python-linz-logger"
Repository = "https://github.com/linz/python-linz-logger"

[dependency-groups]
dev = [
    "black>=24.1.1,<25.0.0",
    "isort>=5.13.1,<6.0.0",
    "mypy",
    "pre-commit",
    "pylint>=3.0.2,<4.0.0",
    "pytest>=7.4.4,<9.0.0",
    "pytest-dependency>=0.6.0,<0.7.0",
]

[tool.uv.build-backend]
module-root = ""

[tool.black]
line-length = 127

[tool.isort]
line_length = 127
case_sensitive = true
use_parentheses = true
include_trailing_comma = true
multi_line_output = 3
force_grid_wrap = 0
